# =====================================================================
# SA Deepfake Fairness — central configuration
# COS700 | Karabo Serothoane | University of Pretoria
#
# Every pipeline stage reads this file. Override any value with a
# custom YAML passed via --config, or per-run CLI flags where offered.
# =====================================================================

seed: 42

paths:
  raw: data/raw                 # symlinks / copies of downloaded datasets
  processed: data/processed     # face-cropped, resized, deduplicated images
  manifests: data/manifests     # CSV manifests produced by each stage
  runs: runs                    # checkpoints, logs, evaluation reports

image:
  size: 224                     # square side fed to the model
  jpeg_quality: 95
  mean: [0.5, 0.5, 0.5]         # timm ViT (augreg) default normalisation
  std:  [0.5, 0.5, 0.5]

face:
  detector: haar                # haar | mtcnn | none  (mtcnn needs facenet-pytorch)
  min_face: 40                  # min detected face side in px
  margin: 0.30                  # box expansion ratio before cropping
  require_face: true            # drop images with no detected face (face datasets only)

dedup:
  enabled: true                 # perceptual-hash exact-duplicate removal
  hash_size: 8

# ---------------------------------------------------------------------
# Datasets (supervisor-provided). `label_rules` map substrings of the
# RELATIVE path (lower-cased) to labels: 1 = fake/AI, 0 = real.
# Rules are checked in order; first match wins. Run
#   python scripts/02_preprocess.py --dry-run
# after download to verify inference on the actual folder layout and
# adjust patterns here if needed.
# ---------------------------------------------------------------------
datasets:
  - name: deepdetect2025
    kaggle: ayushmandatta1/deepdetect-2025
    has_faces: true             # face imagery -> enters the fairness pipeline
    use_in_training: true
    use_in_fairness: true
    label_rules:
      - {pattern: "fake",  label: 1}
      - {pattern: "ai",    label: 1}
      - {pattern: "real",  label: 0}
      - {pattern: "human", label: 0}

  - name: ai_vs_real
    kaggle: rhythmghai/ai-vs-real-images-dataset
    has_faces: true             # mixed content; non-face images are gated out
    use_in_training: true
    use_in_fairness: true
    label_rules:
      - {pattern: "fake",  label: 1}
      - {pattern: "ai",    label: 1}
      - {pattern: "real",  label: 0}
      - {pattern: "human", label: 0}

  - name: cifake
    kaggle: birdy654/cifake-real-and-ai-generated-synthetic-images
    has_faces: false            # 32x32 CIFAR-10 scenes/objects — NO faces.
    use_in_training: false      # excluded from the face model's training set
    use_in_fairness: false      # cannot support a demographic audit
    role: generalization        # used only for cross-domain generalisation tests
    label_rules:
      - {pattern: "fake", label: 1}
      - {pattern: "real", label: 0}

splits:
  train: 0.70
  val: 0.15
  test: 0.15
  stratify_on: [dataset, label, skin_tone]

# ---------------------------------------------------------------------
# Demographic grouping used for fairness-aware training and auditing.
# `skin_tone` (ITA-derived, fully automatic, no external model) is the
# primary axis; `race_proxy` becomes available if you run
#   scripts/03_annotate.py --race-model deepface   (optional extra)
# or merge externally sourced labels via --external-labels CSV.
# ---------------------------------------------------------------------
group:
  key: skin_tone                # skin_tone | race_proxy
  min_group_size: 30            # groups below this are reported but flagged
  skin_tone_categories: [very_light, light, intermediate, tan, brown, dark]

model:
  backbone: vit_base_patch16_224   # any timm model name
  pretrained: true
  freq_branch: true                # dual-branch RGB + frequency-spectrum input
  freq_dim: 128
  embed_dim: 256
  dropout: 0.1

train:
  epochs: 15
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.05
  warmup_epochs: 1
  grad_clip: 1.0
  num_workers: 4
  amp: auto                     # auto | true | false (mixed precision on CUDA)
  balanced_sampler: false       # demographic-balanced sampling (fair recipe: true)
  early_stop_patience: 4
  select_metric: auc            # auc | auc_minus_fprgap (fair recipe default)
  threshold: 0.5                # decision threshold for FPR/TPR-based metrics

loss:
  type: bce                     # bce | dag_fdd | daw_fdd
  dag_alpha: 0.5                # CVaR level: average over worst-alpha fraction
  daw_alpha_group: 0.5          # DAW outer CVaR over group losses
  daw_alpha_sample: 0.8         # DAW inner CVaR within each group

adversarial:                    # feature disentanglement via gradient reversal
  enabled: false                # fair recipe: true
  weight: 0.2                   # beta on the demographic adversary loss
  grl_ramp_epochs: 3            # GRL lambda ramps 0 -> 1 over these epochs
  head_hidden: 128

fpr_penalty:                    # optional differentiable FPR-gap regulariser
  enabled: false
  weight: 0.5

# Named recipes applied by scripts/05_train.py --recipe {name}
recipes:
  baseline:
    loss.type: bce
    train.balanced_sampler: false
    adversarial.enabled: false
    fpr_penalty.enabled: false
    train.select_metric: auc
  fair:
    loss.type: daw_fdd
    train.balanced_sampler: true
    adversarial.enabled: true
    fpr_penalty.enabled: false
    train.select_metric: auc_minus_fprgap

eval:
  bootstrap: 200                # bootstrap resamples for gap confidence intervals
  min_group_size: 30
