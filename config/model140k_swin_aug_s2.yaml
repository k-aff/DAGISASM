# =====================================================================
# SWIN — 140k only, race-grouped, pre-augmented training set.
#
# Data comes from scripts/build_augmented_140k.py, which already did:
#   - source filter to 140k (real and fake share one generation pipeline)
#   - races Black / Indian / White ("Other" dropped as uninterpretable)
#   - split FIRST, then augment TRAIN only
#   - 24,000 train / 1,800 val / 2,400 balanced test
#
# The manifest carries its own `split` column. NOTHING here may re-split.
#
#   python scripts/run_models140k.py --train swin --config config/model140k_swin_aug.yaml
# =====================================================================

seed: 9

paths:
  raw: data/raw/real_vs_fake                  # read-only; no harvest this run
  processed: data/faces140k/processed
  manifests: data/faces140k/manifests
  manifest_file: manifest_aug.csv             # what _load_split() reads
  runs: runs/models140k/swin_aug              # NEW dir: keeps the old run intact

image:
  size: 224
  # harvest-time only; make_transforms() does not re-encode, so nothing
  # here adds a second JPEG generation at load time.
  jpeg_quality: 95
  mean: [0.5, 0.5, 0.5]
  std:  [0.5, 0.5, 0.5]

datasets:
  - name: real-vs-fake
    kaggle: xhlulu/140k-real-and-fake-faces
    has_faces: true
    use_in_training: true
    use_in_fairness: true
    label_rules:
      - {pattern: "fake",  label: 1}
      - {pattern: "real",  label: 0}

# ---------------------------------------------------------------------
# SPLITS — _load_split() reads the manifest's `split` column directly and
# never re-splits, so these only matter if run_pilot.py --stage split is
# ever run against this config. use_existing makes that path safe too.
# ---------------------------------------------------------------------
splits:
  use_existing: true               # honour the manifest `split` column
  group_key: source_id
  stratify_on: []

group:
  key: skin_tone
  min_group_size: 30
  skin_tone_categories: [Black, Indian, White]   # FairFace race, not ITA tone

# make_transforms() applies: Resize -> RandomHorizontalFlip (train only)
# -> ToTensor -> Normalize. No blur, noise, rescale or colour jitter, so it
# is safe to stack on the augmentation already baked into the PNGs. The
# flip is a lossless mirror applied uniformly across races.

model:
  backbone: swin_tiny_patch4_window7_224
  pretrained: true
  freq_branch: true                # frequency branch: keep, it reads artifacts
  freq_dim: 128
  embed_dim: 256
  dropout: 0.1

train:
  epochs: 4                        # raised from 5; early stopping decides the real number
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.05
  warmup_epochs: 1
  grad_clip: 1.0
  num_workers: 4
  amp: false
  balanced_sampler: false          # data is already balanced 4000/cell
  early_stop_patience: 2
  select_metric: auc
  threshold: 0.5

loss:
  type: bce
  dag_alpha: 0.5
  daw_alpha_group: 0.5
  daw_alpha_sample: 0.8

adversarial:
  enabled: false
  weight: 0.2
  grl_ramp_epochs: 2
  head_hidden: 128

fpr_penalty:
  enabled: false
  weight: 0.5

recipes:
  baseline:
    loss.type: bce
    train.balanced_sampler: false
    adversarial.enabled: false
    fpr_penalty.enabled: false
    train.select_metric: auc
  fair:
    loss.type: daw_fdd
    train.balanced_sampler: true
    adversarial.enabled: true
    fpr_penalty.enabled: false
    train.select_metric: auc_minus_fprgap

eval:
  # 100 bootstrap resamples puts each 95% CI endpoint on ~2-3 draws, so the
  # interval bounds move between runs. 2000 is cheap and stable.
  bootstrap: 2000
  min_group_size: 30
